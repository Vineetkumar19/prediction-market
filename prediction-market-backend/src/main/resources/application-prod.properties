#
# Production overrides, activated by SPRING_PROFILES_ACTIVE=prod.
#
# Nothing here has a fallback default for a secret or a URL - if Railway (or
# wherever this runs) doesn't provide the variable, the app refuses to start
# rather than quietly falling back to a localhost/dev value in production.
#
# Everything NOT overridden here keeps its value from application.properties.
#

# Railway injects PORT itself; this also works unchanged on Render, Fly.io,
# or any other platform that follows the same convention.
server.port=${PORT:8080}

# ---------------------------------------------------------------------------
# MySQL - Railway's MySQL plugin injects MYSQLHOST/MYSQLPORT/MYSQLDATABASE/
# MYSQLUSER/MYSQLPASSWORD automatically once the database is attached to this
# service. No values to type in by hand.
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}?useSSL=true&requireSSL=true&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}

# `update` is fine indefinitely for this app - Hibernate only ever adds. Using
# `validate` instead would mean applying database/02_schema.sql by hand on
# every schema change, which is more ceremony than a friend-circle project needs.
spring.jpa.hibernate.ddl-auto=update

# ---------------------------------------------------------------------------
# Secrets and origins - REQUIRED, no default. Missing one fails startup with a
# clear "could not resolve placeholder" error instead of an insecure fallback.
# ---------------------------------------------------------------------------
app.jwt.secret=${JWT_SECRET}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Seed once on the very first deploy, then set SEED_ENABLED=false in Railway's
# variables so a restart never re-seeds over real data.
app.seed.enabled=${SEED_ENABLED:true}

# Quieter logs in production.
logging.level.com.predictionmarket=INFO
logging.level.org.hibernate.SQL=WARN
