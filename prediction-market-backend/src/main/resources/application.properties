#
# Prediction Market Simulator - backend configuration
#
# The only two lines you normally need to touch are the MySQL username and
# password a few lines below. Everything else has a sensible default.
#

spring.application.name=prediction-market-backend
server.port=8080

# ---------------------------------------------------------------------------
# MySQL
# ---------------------------------------------------------------------------
# Create the database once, by hand:
#     CREATE DATABASE prediction_market CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
#
# Tables are created automatically by Hibernate on first start (ddl-auto=update).
# If you prefer to create them yourself, run database/schema.sql and set
# spring.jpa.hibernate.ddl-auto=validate instead.

spring.datasource.url=jdbc:mysql://localhost:3306/prediction_market?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=vineet13245
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ---------------------------------------------------------------------------
# JWT
# ---------------------------------------------------------------------------
# Change this secret before you deploy anywhere public. Minimum 32 characters.
app.jwt.secret=${JWT_SECRET:change-this-secret-to-something-long-and-random-please-0123456789}
app.jwt.expiry-hours=720

# ---------------------------------------------------------------------------
# CORS - which frontend origins may call this API from a browser
# ---------------------------------------------------------------------------
# 5173 = vite dev server, 4173 = vite preview. Add your deployed URL here later.
app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173

# ---------------------------------------------------------------------------
# Business rules (spec sections 3, 6, 16)
# ---------------------------------------------------------------------------
# 10% simulated project charge, taken on entry. NOT a real tax.
app.charge-rate=0.10
#
# There is no payout multiplier any more. Settlement revalues every matched
# share to the final value the admin declares, so a position gains or loses the
# difference between the share price and that value rather than winning or
# losing the whole stake. The maximum swing is the share price itself, because
# that is all the collateral either side put up. See BusinessRules.java.

# Background job that closes questions whose matching deadline has passed.
app.deadline-job.enabled=true
app.deadline-job.interval-ms=30000

# Seed demo accounts + sample events on first start (admin/admin123 etc.).
# Set to false once you have your own real data.
app.seed.enabled=${SEED_ENABLED:true}

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
logging.level.com.predictionmarket=INFO
logging.level.org.hibernate.SQL=WARN
